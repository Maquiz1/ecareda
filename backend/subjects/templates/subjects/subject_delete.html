{% extends "base.html" %}

{% block title %}
Subjects
{% endblock %}

{% block content %}

<h1>Subjects</h1>

<a href="{% url 'subjects:subject_create' %}" class="btn btn-primary mb-3">
    Add Subject
</a>

<table class="table table-bordered">

<tr>
    <th>Subject ID</th>
    <th>Project</th>
    <th>Actions</th>
</tr>

{% for subject in subjects %}

<tr>

<td>{{ subject.subject_id }}</td>
<td>{{ subject.project.name }}</td>

<td>

<a href="{% url 'subjects:subject_detail' subject.pk %}" class="btn btn-info btn-sm">
View
</a>

<a href="{% url 'subjects:subject_update' subject.pk %}" class="btn btn-warning btn-sm">
Edit
</a>

<form method="post"
      action="{% url 'subjects:subject_delete' subject.pk %}"
      style="display:inline;"
      onsubmit="return confirm('Are you sure you want to delete this subject?');">

{% csrf_token %}

<button class="btn btn-danger btn-sm">
Delete
</button>

</form>

</td>

</tr>

{% endfor %}

</table>

{% endblock %}

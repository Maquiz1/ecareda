{% extends "base.html" %}
{% block content %}

<h1>Subjects</h1>

<table border="1">
<tr>
    <th>Subject ID</th>
    <th>Project</th>
    <th>Action</th>
</tr>

{% for subject in subjects %}
<tr>
    <td>{{ subject.subject_id }}</td>
    <td>{{ subject.project.name }}</td>
    <td>
        <a href="{% url 'subject_detail' subject.pk %}">View</a>
    </td>
</tr>
{% endfor %}

</table>

{% endblock %}

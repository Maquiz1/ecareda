{% load static %}

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">



<style>
    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: #f4f6f9;
        font-size: 14px;
    }

    /* ===== LAYOUT ===== */

    .app {
        display: flex;
        min-height: 100vh;
    }

    /* ===== SIDEBAR ===== */

    .sidebar {
        width: 240px;
        background: #1f2d3d;
        color: white;
        transition: .3s;
        overflow-y: auto;
    }

    .sidebar.collapsed {
        width: 70px;
    }

    /* sidebar header */

    .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-logo {
        font-weight: 600;
        font-size: 16px;
        white-space: nowrap;
    }

    .sidebar.collapsed .sidebar-logo span {
        display: none;
    }

    .toggle-btn {
        background: none;
        border: none;
        color: white;
        font-size: 18px;
    }

    /* menu */

    .menu-title {
        padding: 12px 18px;
        font-size: 12px;
        text-transform: uppercase;
        opacity: .6;
    }

    .sidebar a {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #c2c7d0;
        padding: 10px 18px;
        text-decoration: none;
        font-size: 14px;
    }

    .sidebar a:hover {
        background: #32465a;
        color: white;
    }

    .sidebar a.active {
        background: #0d6efd;
        color: white;
    }

    .sidebar.collapsed a span {
        display: none;
    }

    /* ===== MAIN AREA ===== */

    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    /* ===== NAVBAR ===== */

    .topbar {
        background: white;
        border-bottom: 1px solid #e5e5e5;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .nav-icons {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 18px;
        color: #555;
    }

    /* ===== CONTENT ===== */

    .content {
        padding: 25px;
        flex: 1;
    }

    .page-card {
        background: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.05);
    }

    /* ===== FOOTER ===== */

    .footer {
        background: white;
        border-top: 1px solid #eee;
        padding: 12px 20px;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
    }

    /* ===== MOBILE ===== */

    @media(max-width:768px) {

        .sidebar {
            position: fixed;
            left: -240px;
            top: 0;
            height: 100%;
            z-index: 2000;
        }

        .sidebar.show {
            left: 0;
        }

    }

    .menu-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        font-size: 12px;
        text-transform: uppercase;
        opacity: .7;
        cursor: pointer;
    }

    .menu-title:hover {
        background: #32465a;
        color: white;
    }

    .context-badge {
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 20px;
        font-weight: 500;
    }
</style>

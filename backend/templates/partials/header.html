<!-- templates/partials/header.html -->

{% load static %}

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    body {
        background: #f4f6f9;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        overflow-x: hidden;
    }

    /* NAVBAR */

    .navbar-custom {
        background: #2c3e50;
    }

    .navbar-brand {
        font-weight: 600;
        letter-spacing: .5px;
    }

    /* SIDEBAR */

    .sidebar {
        width: 230px;
        min-height: 100vh;
        background: #1f2d3d;
        position: fixed;
        transition: all .3s;
    }

    .sidebar.collapsed {
        margin-left: -230px;
    }

    .sidebar h6 {
        font-size: 11px;
        opacity: .7;
        margin-bottom: 10px;
    }

    .sidebar a {
        display: block;
        color: #c2c7d0;
        padding: 10px 20px;
        text-decoration: none;
        transition: all .2s;
        font-size: 14px;
    }

    .sidebar a:hover {
        background: #32465a;
        color: white;
    }

    .sidebar a.active {
        background: #0d6efd;
        color: white;
    }

    .sidebar a i {
        width: 20px;
    }

    /* MAIN AREA */

    .content-wrapper {
        margin-left: 230px;
        transition: all .3s;
    }

    .content-wrapper.expanded {
        margin-left: 0;
    }

    .main-content {
        background: white;
        border-radius: 8px;
        padding: 25px;
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.05);
        min-height: 80vh;
    }

    /* NAV ICONS */

    .nav-icon {
        color: white;
        font-size: 18px;
        margin-right: 20px;
        position: relative;
    }

    .nav-icon:hover {
        color: #d1d9e0;
    }

    /* FOOTER */

    .footer {
        background: #ffffff;
        border-top: 1px solid #e6e6e6;
        padding: 12px 20px;
        font-size: 13px;
        color: #6c757d;
        margin-left: 230px;
        transition: all .3s;
    }

    .footer.expanded {
        margin-left: 0;
    }

    .menu-title {
        color: #c2c7d0;
        padding: 12px 20px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .menu-title:hover {
        background: #32465a;
        color: white;
    }

    .menu-section a {
        padding-left: 35px;
        font-size: 13px;
    }

    .menu-title i.float-end {
        font-size: 11px;
        opacity: 0.6;
    }
</style>

<!-- templates/partials/sidebar.html -->

<div class="sidebar" id="sidebar">

    <!-- ================= SYSTEM ================= -->

    <div class="menu-section">

        <div class="menu-title" data-bs-toggle="collapse" data-bs-target="#menu-system">
            <i class="fa-solid fa-globe me-2"></i> System
            <i class="fa fa-chevron-down float-end"></i>
        </div>

        <div class="collapse show" id="menu-system">

            <a href="{% url 'countries:countries-list' %}"
                class="{% if request.resolver_match.url_name == 'countries-list' %}active{% endif %}">
                <i class="fa-solid fa-globe"></i> Countries
            </a>

            <a href="{% url 'organizations:organizations-list' %}"
                class="{% if request.resolver_match.url_name == 'organizations-list' %}active{% endif %}">
                <i class="fa-solid fa-building"></i> Organisations
            </a>

            <a href="{% url 'branches:branches-list' %}"
                class="{% if request.resolver_match.url_name == 'branches-list' %}active{% endif %}">
                <i class="fa-solid fa-code-branch"></i> Branches
            </a>

            <a href="{% url 'centers:centers-list' %}"
                class="{% if request.resolver_match.url_name == 'centers-list' %}active{% endif %}">
                <i class="fa-solid fa-hospital"></i> Centers
            </a>

            <a href="{% url 'sites:site-list' %}"
                class="{% if request.resolver_match.url_name == 'site-list' %}active{% endif %}">
                <i class="fa-solid fa-location-dot"></i> Sites
            </a>

            <a href="{% url 'projects:project_list' %}"
                class="{% if request.resolver_match.url_name == 'project_list' %}active{% endif %}">
                <i class="fa-solid fa-flask"></i> Projects
            </a>

        </div>

    </div>



    <!-- ================= DATA COLLECTION ================= -->

    <div class="menu-section">

        <div class="menu-title" data-bs-toggle="collapse" data-bs-target="#menu-data">
            <i class="fa-solid fa-database me-2"></i> Data Collection
            <i class="fa fa-chevron-down float-end"></i>
        </div>

        <div class="collapse show" id="menu-data">

            <a href="{% url 'subjects:subject_list' %}"
                class="{% if request.resolver_match.url_name == 'subject_list' %}active{% endif %}">
                <i class="fa-solid fa-users"></i> Subjects
            </a>

            <a href="{% url 'visits:visit_list' %}"
                class="{% if request.resolver_match.url_name == 'visit_list' %}active{% endif %}">
                <i class="fa-solid fa-calendar-check"></i> Visits
            </a>

            <a href="{% url 'forms_builder:form_list' %}"
                class="{% if request.resolver_match.url_name == 'form_list' %}active{% endif %}">
                <i class="fa-solid fa-file-lines"></i> Forms
            </a>

        </div>

    </div>



    <!-- ================= STUDY ================= -->

    <div class="menu-section">

        <div class="menu-title" data-bs-toggle="collapse" data-bs-target="#menu-study">
            <i class="fa-solid fa-chart-line me-2"></i> Study
            <i class="fa fa-chevron-down float-end"></i>
        </div>

        <div class="collapse show" id="menu-study">

            <a href="{% url 'dashboard:dashboard' %}"
                class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>

            <a href="#">
                <i class="fa-solid fa-chart-column"></i> Reports
            </a>

            <a href="#">
                <i class="fa-solid fa-chart-pie"></i> Monitoring
            </a>

        </div>

    </div>



    <!-- ================= ADMIN ================= -->

    {% if user.is_superuser %}

    <div class="menu-section">

        <div class="menu-title" data-bs-toggle="collapse" data-bs-target="#menu-admin">
            <i class="fa-solid fa-gear me-2"></i> Administration
            <i class="fa fa-chevron-down float-end"></i>
        </div>

        <div class="collapse show" id="menu-admin">

            <a href="{% url 'admin:index' %}">
                <i class="fa-solid fa-gear"></i> Admin Panel
            </a>

        </div>

    </div>

    {% endif %}

</div>

{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>e-Careda</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- <link rel="stylesheet" href="{% static 'css/styles.css' %}"> -->

<style>

body{
    background:#f4f6f9;
    font-size:14px;
    font-family:'Inter',sans-serif;
}

/* NAVBAR */
.navbar-custom{
    background:#2c3e50;
}

.navbar-brand{
    font-size:18px;
    letter-spacing:.5px;
}

/* SIDEBAR */

.sidebar{
    min-height:100vh;
    background:#1f2d3d;
}

.sidebar h6{
    font-size:12px;
    opacity:.7;
}

.sidebar a{
    display:block;
    color:#c2c7d0;
    padding:10px 20px;
    text-decoration:none;
    font-size:14px;
    transition:all .2s;
}

.sidebar a i{
    width:20px;
}

.sidebar a:hover{
    background:#32465a;
    color:white;
}

/* MAIN AREA */

.main-content{
    background:white;
    min-height:90vh;
    border-radius:6px;
    padding:25px;
    box-shadow:0 0 10px rgba(0,0,0,0.05);
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
<div class="container-fluid">

<a class="navbar-brand fw-bold">
<i class="fa-solid fa-heart-pulse me-2"></i>e-Careda
</a>

<div class="d-flex align-items-center text-white">

{% if user.is_authenticated %}

<span class="me-3 small">
<i class="fa fa-user me-1"></i>
{{ user.username }}
</span>

<a href="/admin/logout/" class="btn btn-sm btn-outline-light">
<i class="fa fa-sign-out-alt me-1"></i>Logout
</a>

{% endif %}

</div>

</div>
</nav>


<div class="container-fluid">
<div class="row">

<!-- SIDEBAR -->
<div class="col-md-2 sidebar p-0">

<h6 class="text-white text-uppercase px-3 mt-4">Navigation</h6>

<a href="{% url 'subjects:subject_list' %}">
<i class="fa fa-users"></i> Subjects
</a>

<a href="{% url 'projects:project_list' %}">
<i class="fa fa-diagram-project"></i> Projects
</a>

<a href="{% url 'visits:visit_list' %}">
<i class="fa fa-calendar-check"></i> Visits
</a>

<a href="{% url 'forms_builder:form_list' %}">
<i class="fa fa-file-lines"></i> Forms
</a>

{% if user.is_superuser %}
<a href="{% url 'admin:index' %}">
<i class="fa fa-gear"></i> Admin Panel
</a>
{% endif %}

<hr class="text-light">

<h6 class="text-white text-uppercase px-3">Study</h6>

<a href="{% url 'dashboard:dashboard' %}">
<i class="fa fa-chart-line"></i> Dashboard
</a>

<a href="#">
<i class="fa fa-file-chart-column"></i> Reports
</a>

<a href="#">
<i class="fa fa-chart-pie"></i> Monitoring
</a>

</div>


<!-- MAIN CONTENT -->
<div class="col-md-10 p-4">

<div class="main-content">

{% block content %}
{% endblock %}

</div>

</div>

</div>
</div>

</body>
</html>

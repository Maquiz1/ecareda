<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>eCareda EDC</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            overflow-x: hidden;
        }
        .sidebar {
            height: 100vh;
            background-color: #1e293b;
        }
        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
        }
        .sidebar a:hover {
            background-color: #334155;
            color: white;
        }
        .navbar-custom {
            background-color: #0f172a;
        }
    </style>
</head>
<body>

<!-- 🔝 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">eCareda EDC</a>

        <div class="d-flex align-items-center text-white">
            {% if user.is_authenticated %}
                <span class="me-3">Welcome, {{ user.username }}</span>
                <a href="/admin/logout/" class="btn btn-sm btn-outline-light">Logout</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- 📚 SIDEBAR -->
        <div class="col-md-2 sidebar p-0">

            <h6 class="text-white text-uppercase px-3 mt-4">Navigation</h6>

            <a href="{% url 'subjects:subject_list' %}">Subjects</a>
            <a href="{% url 'projects:project_list' %}">Projects</a>
            <a href="{% url 'visits:visit_list' %}">Visits</a>
            <a href="{% url 'forms_builder:form_list' %}">Forms</a>
            {% if user.is_superuser %}
            <!-- Manuals -->
            <a href="{% url 'admin:index' %}"><i class="fas fa-book"></i><span> Admin Panel</span></a>
            {% endif %}
            <hr class="bg-light">

            <h6 class="text-white text-uppercase px-3">Study</h6>
            <a href="#">Dashboard</a>
            <a href="#">Reports</a>
            <a href="#">Monitoring</a>

        </div>

        <!-- 📄 MAIN CONTENT -->
        <div class="col-md-10 p-4">
            {% block content %}
            {% endblock %}
        </div>

    </div>
</div>

</body>
</html>

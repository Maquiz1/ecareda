<!-- projects_list.html -->
{% extends "base.html" %}

{% block content %}
<h1>Project List ({{ projects | length }})</h1>
<ul>
    {% for project in projects %}
    <li>{{ forloop.counter }}. 
        <a href="{% url 'projects:project_detail' project.pk %}">
            {{ project.name }} - Created on {{ project.created_at }}
        </a>
    </li>    
    {% empty %}
    <li>No projects found.</li>
    {% endfor %}
</ul>
{% endblock %}

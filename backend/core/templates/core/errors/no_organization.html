{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access Restricted</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body{
            background:#f8f9fa;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .error-card{
            max-width:520px;
            text-align:center;
            padding:40px;
            border-radius:12px;
            box-shadow:0 8px 25px rgba(0,0,0,0.08);
            background:white;
        }

        .error-icon{
            font-size:60px;
            color:#dc3545;
        }

        .btn-logout{
            margin-top:20px;
        }
    </style>
</head>

<body>

<div class="error-card">

    <div class="error-icon mb-3">
        ⚠️
    </div>

    <h3 class="mb-3">Access Restricted</h3>

    <p class="text-muted">
        Your account is not assigned to any <strong>organization</strong>.
        <br>
        Please contact the system administrator to be added to an organization
        before using the system.
    </p>

    <div class="mt-4">

        <a href="{% url 'accounts:logout' %}" class="btn btn-danger btn-logout">
            Logout
        </a>

    </div>

</div>

</body>
</html>
